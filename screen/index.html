<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>实时同传字幕</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 48px 80px 130px;
      overflow: hidden;
      user-select: none;
      font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Hiragino Sans GB', sans-serif;
    }

    /* ── Finals area (normal flow, only changes on sentence lock) ──────── */
    #finals-wrap {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* ── Partial overlay (fixed, never shifts finals) ──────────────────── */
    #partial-wrap {
      position: fixed;
      bottom: 48px;
      left: 80px;
      right: 80px;
      opacity: 0.45;
    }

    .sub-line {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ── Text styles ───────────────────────────────────────────────────── */
    :root {
      --zh-size: 30px;
      --en-size: 30px;
      --zh-color: #ffff00;
      --en-color: #4ade80;
      --bg-color: #000000;
    }

    .zh-text {
      font-size: var(--zh-size);
      font-weight: 700;
      color: var(--zh-color);
      line-height: 1.35;
      letter-spacing: 0.03em;
      text-shadow: 0 2px 12px rgba(0,0,0,0.95);
    }

    .en-text {
      font-size: var(--en-size);
      font-weight: 400;
      color: var(--en-color);
      line-height: 1.35;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    }

    /* ── Top-right controls ────────────────────────────────────────────── */
    #top-right {
      position: fixed;
      top: 24px;
      right: 32px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #status {
      font-size: 13px;
      letter-spacing: 0.06em;
      padding: 5px 14px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(4px);
      transition: color 0.4s;
    }
    #status.ok   { color: #4ade80; }
    #status.warn { color: #facc15; }
    #status.err  { color: #f87171; }

    #rec-btn {
      font-size: 13px;
      font-family: inherit;
      letter-spacing: 0.06em;
      padding: 5px 14px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(4px);
      border: none;
      color: rgba(255,255,255,0.55);
      cursor: pointer;
      transition: color 0.3s, background 0.3s;
    }
    #rec-btn:hover { background: rgba(255,255,255,0.13); }
    #rec-btn.recording {
      color: #f87171;
      background: rgba(248,113,113,0.18);
    }

    /* ── Clock (top-left) ───────────────────────────────────────────────── */
    #clock {
      position: fixed;
      top: 24px;
      left: 32px;
      font-size: 13px;
      color: rgba(255,255,255,0.22);
      letter-spacing: 0.08em;
    }

    /* ── Terms version badge (bottom-right, tiny) ──────────────────────── */
    #terms-badge {
      position: fixed;
      bottom: 18px;
      right: 28px;
      font-size: 11px;
      color: rgba(255,255,255,0.15);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div id="clock">--:--</div>
  <div id="top-right">
    <button id="rec-btn">⏺ 录制</button>
    <div id="status" class="err">● 连接中...</div>
  </div>
  <div id="terms-badge">术语库 v0</div>
  <div id="finals-wrap"></div>
  <div id="partial-wrap"></div>

  <script>
    // ── Config ────────────────────────────────────────────────────────────────
    const MAX_FINALS = 3;
    const WS_URL = location.protocol === 'file:'
      ? 'ws://localhost:8000/ws'
      : `ws://${location.host}/ws`;
    const API_BASE = location.protocol === 'file:' ? 'http://localhost:8000' : '';
    const RECONNECT_MS = 2000;
    const PING_INTERVAL_MS = 10000;

    // ── State ─────────────────────────────────────────────────────────────────
    let finals = [];     // [{zh, en}]
    let partial = null;  // {zh} | null
    let ws = null;
    let pingTimer = null;
    let termsVersion = 0;

    // ── Display config (overridden by /config fetch) ──────────────────────────
    let showZh = false;
    let showEn = true;

    // ── Recording state ───────────────────────────────────────────────────────
    let isRecording = false;
    let recordedLines = [];  // [{zh, en, ts}]

    // ── Config fetch ──────────────────────────────────────────────────────────
    async function fetchConfig() {
      try {
        const r = await fetch(API_BASE + '/config');
        if (!r.ok) return;
        const cfg = await r.json();
        showZh = cfg.display_mode !== 'en';
        showEn = cfg.display_mode !== 'zh';
        document.documentElement.style.setProperty('--zh-size', cfg.zh_font_size + 'px');
        document.documentElement.style.setProperty('--en-size', cfg.en_font_size + 'px');
        document.documentElement.style.setProperty('--zh-color', cfg.zh_color);
        document.documentElement.style.setProperty('--en-color', cfg.en_color);
        document.documentElement.style.setProperty('--bg-color', cfg.bg_color);
        render();
      } catch (e) { /* keep defaults */ }
    }

    // ── Render ────────────────────────────────────────────────────────────────
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function renderFinals() {
      const el = document.getElementById('finals-wrap');
      el.innerHTML = finals.map(f => {
        let inner = '';
        if (showZh) inner += `<div class="zh-text">${esc(f.zh)}</div>`;
        if (showEn && f.en) inner += `<div class="en-text">${esc(f.en)}</div>`;
        return inner ? `<div class="sub-line">${inner}</div>` : '';
      }).filter(Boolean).join('');
    }

    function renderPartial() {
      const el = document.getElementById('partial-wrap');
      el.innerHTML = (partial && showZh)
        ? `<div class="zh-text">${esc(partial.zh)}</div>`
        : '';
    }

    function render() { renderFinals(); renderPartial(); }

    // ── Recording helpers ─────────────────────────────────────────────────────
    function downloadDoc() {
      const dateStr = new Date().toLocaleString('zh-CN');
      const rows = recordedLines.map(r => {
        const t = r.ts ? new Date(r.ts).toLocaleTimeString('zh-CN') : '';
        return `<tr>
          <td style="color:#888;font-size:12px;white-space:nowrap;padding:6px 10px;border-bottom:1px solid #eee;">${esc(t)}</td>
          <td style="font-size:15px;padding:6px 10px;border-bottom:1px solid #eee;">${esc(r.zh)}</td>
          <td style="font-size:14px;color:#1d4ed8;padding:6px 10px;border-bottom:1px solid #eee;">${esc(r.en)}</td>
        </tr>`;
      }).join('');
      const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>字幕记录</title></head><body style="font-family:Microsoft YaHei,Arial,sans-serif;padding:24px;">
<h2 style="margin-bottom:4px;">实时同传字幕记录</h2>
<p style="color:#666;font-size:13px;margin-bottom:16px;">导出时间：${dateStr}　共 ${recordedLines.length} 句</p>
<table style="border-collapse:collapse;width:100%;">
<thead><tr>
  <th style="text-align:left;padding:6px 10px;border-bottom:2px solid #ccc;">时间</th>
  <th style="text-align:left;padding:6px 10px;border-bottom:2px solid #ccc;">中文</th>
  <th style="text-align:left;padding:6px 10px;border-bottom:2px solid #ccc;">译文</th>
</tr></thead>
<tbody>${rows}</tbody>
</table></body></html>`;
      const blob = new Blob([html], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const fname = `字幕记录_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.doc`;
      a.download = fname;
      a.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById('rec-btn').addEventListener('click', () => {
      const btn = document.getElementById('rec-btn');
      if (!isRecording) {
        isRecording = true;
        recordedLines = [];
        btn.textContent = '⏹ 停止录制';
        btn.classList.add('recording');
      } else {
        isRecording = false;
        btn.textContent = '⏺ 录制';
        btn.classList.remove('recording');
        downloadDoc();
      }
    });

    // ── Message handler ───────────────────────────────────────────────────────
    function onMessage(data) {
      if (data.status === 'final') {
        partial = null;
        finals.push({ zh: data.zh, en: data.en || '' });
        if (finals.length > MAX_FINALS) finals.shift();
        if (isRecording) recordedLines.push({ zh: data.zh, en: data.en || '', ts: data.ts || new Date().toISOString() });
        renderFinals();
        renderPartial();
      } else {
        partial = { zh: data.zh };
        renderPartial();   // finals are untouched — zero layout shift
      }

      // Sync terms version if server sends it
      if (data.terms_version !== undefined && data.terms_version !== termsVersion) {
        termsVersion = data.terms_version;
        document.getElementById('terms-badge').textContent = `术语库 v${termsVersion}`;
      }
    }

    // ── WebSocket ─────────────────────────────────────────────────────────────
    function setStatus(cls, text) {
      const el = document.getElementById('status');
      el.className = cls;
      el.textContent = text;
    }

    function startPing() {
      pingTimer = setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send('ping');
      }, PING_INTERVAL_MS);
    }

    function stopPing() {
      if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
    }

    function connect() {
      try {
        ws = new WebSocket(WS_URL);
      } catch (e) {
        setStatus('err', '● 地址错误');
        return;
      }

      ws.onopen = () => {
        setStatus('ok', '● 直播中');
        startPing();
        fetchConfig();
      };

      ws.onmessage = (e) => {
        try { onMessage(JSON.parse(e.data)); }
        catch (err) { /* ignore non-JSON pongs */ }
      };

      ws.onclose = () => {
        stopPing();
        setStatus('warn', '● 重连中...');
        setTimeout(connect, RECONNECT_MS);
      };

      ws.onerror = () => {
        setStatus('err', '● 连接异常');
      };
    }

    // ── Clock ─────────────────────────────────────────────────────────────────
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = h + ':' + m;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ── Fullscreen on double-click ─────────────────────────────────────────────
    document.addEventListener('dblclick', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // ── Clear logs when tab closes ────────────────────────────────────────────
    window.addEventListener('beforeunload', () => {
      navigator.sendBeacon(API_BASE + '/logs/clear');
    });

    // ── Init ──────────────────────────────────────────────────────────────────
    connect();
  </script>
</body>
</html>
